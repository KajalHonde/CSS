<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: chartreuse;
        }

        h1:hover{
            color: red;
            font-size: 50px;
            text-shadow: 4px 5px 6px orange;
        }
        
        .h2:hover{
            padding: 40px;
            background-color: aqua;
            color: black;
            font-size: 20px; 
            text-shadow: 4px 5px 6px orange;
            margin: 20px;
            background: linear-gradient(red,yellow,skyblue);
        }
        h2:active{
          color: lime;
          font-size: 60px;
          cursor: pointer;
        }

        a:visited{
            color:orange;
        }

        input:focus{
            background-color: black;
            color: aliceblue;
            border: 4px solid yellowgreen;
        }

        p::first-letter{
            color: chartreuse;
        }
        p::first-line{
            color: yellow;
        }

        p::selection{
            color: brown;
            background-color: chocolate;
        }

    </style>
</head>
