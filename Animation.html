                0%{background-image: url('C:\Github_Projects\CSS\images\ganesha.png');}

                50%{background-color: dodgerblue;left: 300px;top: 300px;background-image: url(C:\Github_Projects\CSS\images\kanha.avif);}
                75%{left:0px;top: 30px;background-image: url(C:\Github_Projects\CSS\images\orange.png);}
                100%{background-color: hotpink;left:0px;top: 30px;}
            }

    </style>
</head>

    <div></div>
