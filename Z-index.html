<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contaner{
            position: relative;
            margin: 100px;
        }
        div{
            width: 100px;
            font-size: medium;
            height: 100px;
            position: absolute;
            border: 3px solid white;
            font-weight: 600;
            text-align: center;
            border-radius: 50%;
            color: azure;
        }

        .blue{
            background-color: blue;
            left: 40px;
            z-index: 5;
            
        }
        .green{
            background-color: green;
            left: 80px;
            z-index: 2;
            
        }
        .red{
            background-color: red;
            left: 120px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="blue">Blue</div>
        <div class="red">RED</div>
        <div class="green">Green</div>
    </div>
</body>
</html>
