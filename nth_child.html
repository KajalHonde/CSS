<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            padding: 10px;
            width: 200px;
            list-style: none;
            font-weight: 900;
        }

        li{
            padding: 10px;
            border: 3px solid black;
            margin-bottom: 6px;
            border-radius: 5px;
        }

        li:nth-child(odd){
            background-color: aqua;
        }
        li:nth-child(even){
            background-color: chartreuse;
        }
        li:last-child{
            background-color: darkblue;
        }
        li:first-child{
            background-color: darkkhaki;
        }
        li:nth-child(5){
            background-color: gold;
        }
    </style>
</head>
<body>
    <h2>List with :nth-child Example</h2>

     <ul>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
        <li>item 4</li>
        <li>item 5</li>
        <li>item 6</li>
     </ul>

</body>
</html>
