<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            padding-top: 50px;
            margin-left: 30px;
            justify-content: center;
        }
        .box{
            background-color: coral;
            height: 150px;
            width: 150px;
            display: flex;
            justify-content: center;
            font-size: 14px;
            border-radius: 10px;
            margin-left: 20px;
            margin-bottom: 20px;
            gap: 30px;
            align-items: center;
            transition: transform 3s ease-in 500ms;
        }
        .box1:hover{
            transform: translate(125px,125px);
        }
        .box2:hover{
            transform: translateX(80px);
        }
        .box3:hover{
            transform: translateY(80px);
        }
         .box4:hover{
            transform: rotate(90deg);
        }
         .box5:hover{
            transform: skewx(20deg);
        }
         .box6:hover{
            transform: rotate(360deg);
        }
         .box7:hover{
            transform:scale(10)
        }
        .box8:hover{
            transform:rotate(90deg) scale(1.4) translate(80px)
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="box box1">Translate</div>
        <div class="box box2">Translate x</div>
        <div class="box box3">Translate Y</div>
        <div class="box box4">Rotate </div>
        <div class="box box5">Skew X</div>
        <div class="box box6">Rotate Y</div>
        <div class="box box7">Scaling</div>
         <div class="box box8">Multi</div>
     </div>
</body>
</html>
